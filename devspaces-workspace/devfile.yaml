schemaVersion: 2.3.0
metadata:
  generateName: ansible-ai-assistant-
  description: "Ansible playbook development with AI coding assistance via MaaS"
attributes:
  controller.devfile.io/storage-type: per-user
projects:
  - name: ansible-playbooks
    git:
      remotes:
        origin: 'https://github.com/alezzandro/ocp-maas-devspaces-chatbot'
      checkoutFrom:
        revision: main
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryLimit: 4Gi
      memoryRequest: 2Gi
      cpuLimit: 4000m
      cpuRequest: 1000m
      mountSources: true
      sourceMapping: /projects
      env:
        - name: ANSIBLE_FORCE_COLOR
          value: "true"
commands:
  - id: setup-continue-config
    exec:
      component: tools
      commandLine: |
        mkdir -p /home/user/.continue
        if [ -f /etc/continue-config/config.json ]; then
          cp /etc/continue-config/config.json /home/user/.continue/config.json
        fi
        if [ -f /etc/continue-config/config.yaml ]; then
          cp /etc/continue-config/config.yaml /home/user/.continue/config.yaml
        fi
        VSIX=/home/user/.continue/Continue.continue.vsix
        if [ ! -s "$VSIX" ]; then
          curl -fsSL --retry 3 -o "$VSIX" \
            "https://open-vsx.org/api/Continue/continue/linux-x64/2.0.0/file/Continue.continue-2.0.0@linux-x64.vsix" \
            || echo "WARNING: could not download Continue vsix (DEFAULT_EXTENSIONS install will skip until next start)"
        fi
        echo "Continue AI config ready at /home/user/.continue/"
events:
  postStart:
    - setup-continue-config

apiVersion: v1
kind: LimitRange
metadata:
  name: agent-defaults
  namespace: agent-governance
  labels:
    app.kubernetes.io/part-of: agent-identity-lab
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 2Gi
